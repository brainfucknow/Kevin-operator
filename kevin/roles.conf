# Kevin role catalogue. File order is the canonical order a route follows.
# A project's roles.conf may also add a stage or a gate; see kevin/README.md#configuration.
#
#   <role> <tier> <runs-as> [optional] [send-back]
#   <role> <tier> subagent gate
#   <role> <tier> subagent spec-judge
#
# tier     frontier | strong | fast   (mapped per harness in tiers.conf)
# runs-as  subagent | session
# optional excluded from the fallback route; include it explicitly in a named
#          route, --route, or KEVIN_ROUTE to enable it.
# send-back
#          `kevin handoff <id> --to <role>` at this role's stage may name an
#          earlier role on the route other than the specifier. The task then
#          moves forward along the route again. kevin refuses the third send-back
#          of a task. Combines with optional; not on a gate or a spec-judge.
# gate     not a stage and never on a route: a read-only subagent the
#          orchestrator (or `kevin run`) dispatches on a specification after the
#          specifier's `kevin review` and before the operator approves, on a
#          task that chose it (`kevin new --gates`, `kevin gates <id> <gates>`). Its
#          report is shown at the gate. `kevin gates` lists the gate roles.
# spec-judge
#          at most one. Not a stage, not a gate, never on a route. A read-only
#          subagent that gives a spec verdict on the gate findings of each
#          spec revision that a gate audited. The orchestrator records it with
#          `kevin spec-verdict` (handoff-protocol.md, Spec revisions). `kevin dispatch` refuses it and
#          `kevin run` never runs it locally; with the mistral backend one
#          workflow execution runs it at approval and returns its verdict
#          for `kevin spec-verdict`. Delete the line to turn the loop off.
#
# The route of a task (routes.conf, `kevin new --route`) sets which roles it
# visits. The operator's session is the orchestrator. A `subagent` role (the
# default) runs as a delegated agent on the tier's model and reports back to
# the orchestrator. It stops for the operator with `kevin review` or `kevin ask`. A
# `session` role (opt-in) runs in chat in the orchestrator itself, for example
# to write a specification with the operator turn by turn.
specifier frontier subagent
falsifier strong   subagent gate
spec-judge strong  subagent spec-judge
architecture-design-reviewer strong subagent optional
coder     strong   subagent
cleaner   fast     subagent
architect strong   subagent
hardener  fast     subagent
security-reviewer strong subagent optional
pr-reviewer strong subagent optional send-back
qa        strong   subagent
