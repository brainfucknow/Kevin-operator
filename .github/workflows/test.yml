name: test
on:
  push:
  pull_request:
jobs:
  kevin-min-bb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Maven and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('kevin/tools.conf', 'kevin/tools/*/bb.edn', 'test/acceptance/bb.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Install the oldest Babashka kevin supports
        env:
          BB_VERSION: 1.12.216
          BB_SHA256: 920b2d6e6b6580795a8cf1698aa124733bb26065bb10956842272caf8e5299ae
        run: |
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors -o bb.tar.gz \
            "https://github.com/babashka/babashka/releases/download/v$BB_VERSION/babashka-$BB_VERSION-linux-amd64.tar.gz"
          echo "$BB_SHA256  bb.tar.gz" | sha256sum --check
          tar -xzf bb.tar.gz -C "$HOME/bin"
          rm bb.tar.gz
          "$HOME/bin/bb" --version
      - name: Download dependencies with retries
        run: |
          for attempt in 1 2 3 4 5; do
            if bb --config kevin/tools/kevin/bb.edn -e nil; then
              exit 0
            fi
            echo "dependency download failed on attempt $attempt (Maven Central may answer HTTP 429); retrying" >&2
            sleep $((attempt * 15))
          done
          echo "dependency download kept failing" >&2
          exit 1
      - name: Test kevin
        run: bash test/kevin_test.sh
      - name: Run the CRAP gate on the minimum Babashka
        run: |
          kevin/bin/kevin tool ensure crap4clj
          mkdir -p tmp
          if ! .kevin/bin/crap4clj --source-root kevin/tools/core/src > tmp/crap4clj.log 2>&1; then
            cat tmp/crap4clj.log
            echo "crap4clj failed on bb $(bb --version)" >&2
            exit 1
          fi
          cat tmp/crap4clj.log
          grep -q "CRAP Report" tmp/crap4clj.log || { echo "no CRAP report in the crap4clj output" >&2; exit 1; }
          if grep -q "Exception" tmp/crap4clj.log; then
            echo "a stack trace appears in the crap4clj output" >&2
            exit 1
          fi
          if ! bb -e '(let [entries (:entries (read-string (slurp "kevin/tools/core/.metrics/crap.edn")))]
                         (when (or (empty? entries) (every? #(zero? (:coverage %)) entries))
                           (println "every function reads 0.0% coverage; the coverage gate did not instrument")
                           (System/exit 1)))'; then
            echo "the CRAP report shows 0.0% coverage for every function on bb $(bb --version)" >&2
            exit 1
          fi
  kevin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Maven and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('kevin/tools.conf', 'kevin/tools/*/bb.edn', 'test/acceptance/bb.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - name: No mutation manifests in the tree
        run: bash test/no_manifests.sh
      - name: Test the manifest guard
        run: bash test/no_manifests_test.sh
      - name: Install Babashka
        env:
          BB_VERSION: 1.13.229
          BB_SHA256: a98c90a0530943dfa9a0b03bcccbc2030777a6ce094af303d5bb47d77e193299
        run: |
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors -o bb.tar.gz \
            "https://github.com/babashka/babashka/releases/download/v$BB_VERSION/babashka-$BB_VERSION-linux-amd64.tar.gz"
          echo "$BB_SHA256  bb.tar.gz" | sha256sum --check
          tar -xzf bb.tar.gz -C "$HOME/bin"
          rm bb.tar.gz
          "$HOME/bin/bb" --version
      - name: Download dependencies with retries
        run: |
          for attempt in 1 2 3 4 5; do
            if bb --config kevin/tools/kevin/bb.edn -e nil; then
              exit 0
            fi
            echo "dependency download failed on attempt $attempt (Maven Central may answer HTTP 429); retrying" >&2
            sleep $((attempt * 15))
          done
          echo "dependency download kept failing" >&2
          exit 1
      - name: Test kevin
        run: bash test/kevin_test.sh
      - name: Test kevin tool
        run: bash test/kevin_tool_test.sh
      - name: Unit specs for kevin
        run: bb --config kevin/tools/kevin/bb.edn spec
      - name: Hardening checks for kevin
        run: bb --config kevin/tools/kevin/bb.edn hardening
      - name: Property tests for kevin
        run: bb --config kevin/tools/kevin/bb.edn property
      - name: Acceptance tests for kevin
        run: |
          kevin/bin/kevin tool ensure gherkin-parser
          bash test/acceptance.sh
      - name: Test kevin-cs
        run: bb --config kevin/tools/csharp/bb.edn test
      - name: Property-test kevin-cs
        run: bb --config kevin/tools/csharp/bb.edn property
      - name: Test kevin-js
        run: bb --config kevin/tools/javascript/bb.edn test
      - name: Property-test kevin-js
        run: bb --config kevin/tools/javascript/bb.edn property
      - name: Accept kevin-js
        run: |
          kevin/bin/kevin tool ensure gherkin-parser
          bb --config kevin/tools/javascript/bb.edn acceptance
      - name: Unit specs for kevin-java
        run: bb --config kevin/tools/java/bb.edn spec
      - name: Hardening checks for kevin-java
        run: bb --config kevin/tools/java/bb.edn hardening
      - name: Property tests for kevin-java
        run: bb --config kevin/tools/java/bb.edn property
      - name: Accept kevin-java
        run: |
          kevin/bin/kevin tool ensure gherkin-parser
          bb --config kevin/tools/java/bb.edn acceptance
      - name: Test kevin-cpp
        run: bb --config kevin/tools/cpp/bb.edn test
      - name: Property-test kevin-cpp
        run: bb --config kevin/tools/cpp/bb.edn property
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: End-to-end kevin-cpp with gcov
        run: bash test/kevin_cpp_e2e_test.sh
      - name: Test kevin-rb
        run: bb --config kevin/tools/ruby/bb.edn test
      - name: Property-test kevin-rb
        run: bb --config kevin/tools/ruby/bb.edn property
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler: "4.0.18"
      - name: End-to-end kevin-rb with the real gems
        run: bash test/kevin_rb_e2e_test.sh
  workflows-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Test kevin/workflows
        run: |
          cd kevin/workflows
          uv run --frozen pytest
