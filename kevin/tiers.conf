# Model for each tier and harness. After a change, run `kevin adapters`: in a
# project it writes the project agents the change needs (a Claude Code alias
# needs none); in the Kevin source checkout it also regenerates the plugin
# agents. A project that relies on project agents sets Minimum Kevin version: 0.3.0.
# A value starts with a letter or a digit and holds only letters, digits and . _ : / @ [ ] -
#
#   <tier> <claude-model> <codex-reasoning-effort> <copilot-model> [<kilo-model>] [<vibe-model>]
#
# claude-model            value for `model:` in Claude Code agents (inherit, opus, sonnet, haiku, fable, or a full id)
# codex-reasoning-effort  value for `model_reasoning_effort` in .codex/agents (low, medium, high)
# copilot-model           value for `model:` in Copilot CLI agents (see `copilot --help` for ids)
# kilo-model              value for `model:` in .kilo/agent (provider/model, or inherit to use the session model)
# vibe-model              value for `active_model` in .vibe/agents (a Vibe model alias, or inherit to use the session model)
frontier inherit high   gpt-6.1-sol   inherit mistral-large-latest
strong   opus    medium gpt-6.1-sol   inherit mistral-medium-latest
fast     sonnet  low    gpt-6.1-terra inherit mistral-small-latest
