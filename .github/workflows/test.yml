name: test
on:
  push:
  pull_request:
jobs:
  sf-min-bb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Maven and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('swarmforge/tools.conf', 'swarmforge/tools/*/bb.edn', 'test/acceptance/bb.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Install the oldest Babashka sf supports
        env:
          BB_VERSION: 1.12.215
          BB_SHA256: 8248ed0bf9cac6f118613d034f1def14fc6db88c6d6aec785b2da7245c58e225
        run: |
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors -o bb.tar.gz \
            "https://github.com/babashka/babashka/releases/download/v$BB_VERSION/babashka-$BB_VERSION-linux-amd64.tar.gz"
          echo "$BB_SHA256  bb.tar.gz" | sha256sum --check
          tar -xzf bb.tar.gz -C "$HOME/bin"
          rm bb.tar.gz
          "$HOME/bin/bb" --version
      - name: Download dependencies with retries
        run: |
          for attempt in 1 2 3 4 5; do
            if bb --config swarmforge/tools/sf/bb.edn -e nil; then
              exit 0
            fi
            echo "dependency download failed on attempt $attempt (Maven Central may answer HTTP 429); retrying" >&2
            sleep $((attempt * 15))
          done
          echo "dependency download kept failing" >&2
          exit 1
      - name: Test sf
        run: bash test/sf_test.sh
  sf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Maven and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('swarmforge/tools.conf', 'swarmforge/tools/*/bb.edn', 'test/acceptance/bb.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - name: No mutation manifests in the tree
        run: bash test/no_manifests.sh
      - name: Test the manifest guard
        run: bash test/no_manifests_test.sh
      - name: Install Babashka
        env:
          BB_VERSION: 1.13.229
          BB_SHA256: a98c90a0530943dfa9a0b03bcccbc2030777a6ce094af303d5bb47d77e193299
        run: |
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors -o bb.tar.gz \
            "https://github.com/babashka/babashka/releases/download/v$BB_VERSION/babashka-$BB_VERSION-linux-amd64.tar.gz"
          echo "$BB_SHA256  bb.tar.gz" | sha256sum --check
          tar -xzf bb.tar.gz -C "$HOME/bin"
          rm bb.tar.gz
          "$HOME/bin/bb" --version
      - name: Download dependencies with retries
        run: |
          for attempt in 1 2 3 4 5; do
            if bb --config swarmforge/tools/sf/bb.edn -e nil; then
              exit 0
            fi
            echo "dependency download failed on attempt $attempt (Maven Central may answer HTTP 429); retrying" >&2
            sleep $((attempt * 15))
          done
          echo "dependency download kept failing" >&2
          exit 1
      - name: Test sf
        run: bash test/sf_test.sh
      - name: Test sf tool
        run: bash test/sf_tool_test.sh
      - name: Unit specs for sf
        run: bb --config swarmforge/tools/sf/bb.edn spec
      - name: Hardening checks for sf
        run: bb --config swarmforge/tools/sf/bb.edn hardening
      - name: Property tests for sf
        run: bb --config swarmforge/tools/sf/bb.edn property
      - name: Acceptance tests for sf
        run: |
          swarmforge/bin/sf tool ensure gherkin-parser
          bash test/acceptance.sh
      - name: Test sf-cs
        run: bb --config swarmforge/tools/csharp/bb.edn test
      - name: Property-test sf-cs
        run: bb --config swarmforge/tools/csharp/bb.edn property
      - name: Test sf-js
        run: bb --config swarmforge/tools/javascript/bb.edn test
      - name: Property-test sf-js
        run: bb --config swarmforge/tools/javascript/bb.edn property
      - name: Accept sf-js
        run: |
          swarmforge/bin/sf tool ensure gherkin-parser
          bb --config swarmforge/tools/javascript/bb.edn acceptance
      - name: Unit specs for sf-java
        run: bb --config swarmforge/tools/java/bb.edn spec
      - name: Hardening checks for sf-java
        run: bb --config swarmforge/tools/java/bb.edn hardening
      - name: Property tests for sf-java
        run: bb --config swarmforge/tools/java/bb.edn property
      - name: Accept sf-java
        run: |
          swarmforge/bin/sf tool ensure gherkin-parser
          bb --config swarmforge/tools/java/bb.edn acceptance
      - name: Test sf-rb
        run: bb --config swarmforge/tools/ruby/bb.edn test
      - name: Property-test sf-rb
        run: bb --config swarmforge/tools/ruby/bb.edn property
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler: "4.0.18"
      - name: End-to-end sf-rb with the real gems
        run: bash test/sf_rb_e2e_test.sh
  workflows-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Test swarmforge/workflows
        run: |
          cd swarmforge/workflows
          uv run --frozen pytest
